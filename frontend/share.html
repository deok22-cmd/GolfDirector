<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#059669" />
  <title>골프 비용 정산 내역 · 골프총무</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>body{font-family:Pretendard,system-ui,sans-serif}</style>
</head>
<body class="bg-slate-100 text-slate-900 antialiased">
  <div class="max-w-xl mx-auto min-h-screen bg-slate-50">

    <header class="bg-emerald-600 text-white px-4 py-3 flex items-center gap-2">
      <span class="text-lg">⛳</span>
      <div class="font-extrabold">골프총무 <span class="text-emerald-100 font-medium text-xs">정산 내역</span></div>
    </header>

    <div id="loading" class="text-center text-slate-400 py-20 text-sm">불러오는 중…</div>

    <main id="content" class="hidden px-4 py-5 space-y-4">
      <!-- 헤더 + 6분할 요약 -->
      <div class="bg-white rounded-2xl border border-slate-200 p-4">
        <div class="text-[11px] font-bold text-emerald-700"><span id="s-owner"></span></div>
        <h1 id="s-title" class="text-xl font-extrabold text-slate-800 mt-0.5"></h1>
        <div id="s-sub" class="text-xs text-slate-400 mt-0.5"></div>
        <div class="mt-3 bg-emerald-600 text-white rounded-xl p-4">
          <div class="grid grid-cols-[2.6rem_1fr_1fr_1fr] gap-x-1.5 gap-y-1 items-center text-center">
            <div></div>
            <div class="text-[10px] text-emerald-100">전체</div>
            <div class="text-[10px] text-emerald-100">지급완료</div>
            <div class="text-[10px] text-emerald-100">미지급</div>
            <div class="text-[10px] text-emerald-100 text-left font-bold">1인당</div>
            <div id="s-pp-all" class="text-base font-extrabold">₩0</div>
            <div id="s-pp-paid" class="text-xs font-bold text-emerald-50">₩0</div>
            <div id="s-pp-unpaid" class="text-xs font-bold text-yellow-200">₩0</div>
            <div class="text-[10px] text-emerald-100 text-left font-bold">전체</div>
            <div id="s-g-all" class="text-base font-bold">₩0</div>
            <div id="s-g-paid" class="text-xs font-bold text-emerald-50">₩0</div>
            <div id="s-g-unpaid" class="text-xs font-bold text-yellow-200">₩0</div>
          </div>
          <div class="text-[10px] text-emerald-100 text-right mt-1">일행 <span id="s-ppl"></span>명 기준</div>
        </div>
      </div>

      <!-- 내 미지급 송금 -->
      <div class="bg-white rounded-2xl border-2 border-rose-200 p-4">
        <div class="text-[11px] font-bold text-slate-500">내가 보낼 금액 (1인당 미지급)</div>
        <div id="s-mypay" class="text-2xl font-extrabold text-rose-600">₩0</div>
        <div id="s-account" class="text-sm text-slate-600 mt-1.5"></div>
        <button id="s-copy" class="w-full mt-2 bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl">📋 계좌·금액 복사 (토스로 송금)</button>
      </div>

      <!-- 항목 상세 -->
      <div class="bg-white rounded-2xl border border-slate-200 p-4">
        <div class="text-[11px] font-bold text-slate-500 mb-1">상세 내역</div>
        <div id="s-rows"></div>
      </div>

      <!-- 광고 자리 -->
      <div id="ad-slot" class="text-center text-[10px] text-slate-300 py-6 border border-dashed border-slate-200 rounded-xl">
        광고 영역 (Google AdSense)
      </div>

      <!-- 유입 CTA -->
      <a href="./" class="block text-center bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-2xl">
        나도 무료로 골프총무 서비스 이용하기 →
      </a>
      <p class="text-center text-[11px] text-slate-400 pb-6">골프총무 — 환율 자동·N빵·카톡 공유까지 무료</p>
    </main>
  </div>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 px-4 py-2.5 rounded-xl bg-slate-900 text-white text-sm font-semibold shadow-lg opacity-0 translate-y-2 transition-all duration-300 pointer-events-none"></div>

  <script src="mockData.js"></script>
  <script src="share.js"></script>
</body>
</html>
