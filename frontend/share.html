<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#059669" />
  <title>골프 비용 정산 내역 · 골프총무</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>body{font-family:Pretendard,system-ui,sans-serif}</style>
</head>
<body class="bg-slate-100 text-slate-900 antialiased">
  <div class="max-w-xl mx-auto min-h-screen bg-slate-50">

    <header class="bg-emerald-600 text-white px-4 py-3 flex items-center gap-2">
      <span class="text-lg">⛳</span>
      <div class="font-extrabold">골프총무 <span class="text-emerald-100 font-medium text-xs">정산 내역</span></div>
    </header>

    <div id="loading" class="text-center text-slate-400 py-20 text-sm">불러오는 중…</div>

    <main id="content" class="hidden px-4 py-5 space-y-4">
      <!-- 헤더 -->
      <div class="bg-white rounded-2xl border border-slate-200 p-4">
        <div class="text-[11px] font-bold text-emerald-700"><span id="s-owner"></span></div>
        <h1 id="s-title" class="text-xl font-extrabold text-slate-800 mt-0.5"></h1>
        <div id="s-sub" class="text-xs text-slate-400 mt-0.5"></div>
        <div class="mt-3 bg-emerald-600 text-white rounded-xl p-4">
          <div class="text-[11px] text-emerald-100">예상 1인당</div>
          <div id="s-perperson" class="text-3xl font-extrabold leading-tight">₩0</div>
          <div class="grid grid-cols-3 gap-1.5 mt-3 text-center">
            <div class="bg-white/10 rounded-lg py-1.5"><div class="text-[10px] text-emerald-100">전체</div><div id="s-group" class="text-xs font-bold">₩0</div></div>
            <div class="bg-white/10 rounded-lg py-1.5"><div class="text-[10px] text-emerald-100">지급완료</div><div id="s-paid" class="text-xs font-bold">₩0</div></div>
            <div class="bg-white/10 rounded-lg py-1.5"><div class="text-[10px] text-emerald-100">미지급</div><div id="s-unpaid" class="text-xs font-bold">₩0</div></div>
          </div>
        </div>
      </div>

      <!-- 항목 상세 -->
      <div class="bg-white rounded-2xl border border-slate-200 p-4">
        <div class="text-[11px] font-bold text-slate-500 mb-1">상세 내역</div>
        <div id="s-rows"></div>
      </div>

      <!-- 광고 자리 -->
      <div id="ad-slot" class="text-center text-[10px] text-slate-300 py-6 border border-dashed border-slate-200 rounded-xl">
        광고 영역 (Google AdSense)
      </div>

      <!-- 유입 CTA -->
      <a href="./" class="block text-center bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-2xl">
        나도 무료로 골프총무 서비스 이용하기 →
      </a>
      <p class="text-center text-[11px] text-slate-400 pb-6">골프총무 — 환율 자동·N빵·카톡 공유까지 무료</p>
    </main>
  </div>

  <script src="mockData.js"></script>
  <script src="share.js"></script>
</body>
</html>
