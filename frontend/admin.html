<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>골프총무 · 관리자</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>body{font-family:Pretendard,system-ui,sans-serif}</style>
</head>
<body class="bg-slate-100 text-slate-900 antialiased">
  <div class="max-w-3xl mx-auto min-h-screen bg-slate-50">
    <header class="bg-slate-900 text-white px-4 py-3 flex items-center justify-between">
      <div class="font-extrabold">🔧 골프총무 관리자</div>
      <a href="./" class="text-xs bg-white/15 hover:bg-white/25 rounded-lg px-2.5 py-1">← 서비스로</a>
    </header>

    <div id="gate" class="text-center text-slate-500 py-20 text-sm">확인 중…</div>

    <main id="admin" class="hidden">
      <nav class="flex gap-1 px-4 pt-3 border-b border-slate-200 bg-white sticky top-0">
        <button data-tab="stats" class="tab px-3 py-2 text-sm font-bold border-b-2 border-emerald-600 text-emerald-700">통계</button>
        <button data-tab="users" class="tab px-3 py-2 text-sm font-bold border-b-2 border-transparent text-slate-500">회원</button>
        <button data-tab="trips" class="tab px-3 py-2 text-sm font-bold border-b-2 border-transparent text-slate-500">여행</button>
        <button data-tab="notice" class="tab px-3 py-2 text-sm font-bold border-b-2 border-transparent text-slate-500">공지</button>
      </nav>
      <section id="panel" class="p-4"></section>
    </main>
  </div>
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 px-4 py-2.5 rounded-xl bg-slate-900 text-white text-sm font-semibold shadow-lg opacity-0 translate-y-2 transition-all duration-300 pointer-events-none"></div>
  <script src="admin.js"></script>
</body>
</html>
