<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>골프 비용 계산기 · 골프총무</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Pretendard', 'Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
</head>

<body class="bg-slate-100 text-slate-900 font-sans antialiased min-h-screen">
  <div class="max-w-2xl mx-auto px-4 py-5">

    <!-- 헤더 -->
    <header class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-emerald-600 flex items-center justify-center text-lg shadow-sm">⛳</div>
        <div>
          <h1 class="text-base font-extrabold leading-tight">골프 비용 계산기</h1>
          <p class="text-[11px] text-slate-400">숫자만 넣으면 1인당 얼마인지 바로 나와요</p>
        </div>
      </div>
      <a href="dashboard.html" class="text-[11px] text-slate-400 hover:text-slate-600 underline">고급(매트릭스) 보기 →</a>
    </header>

    <!-- 입력 카드 -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-5">
      <div class="flex flex-wrap items-end gap-3 mb-4">
        <div class="flex-1 min-w-[160px]">
          <label class="block text-[11px] font-bold text-slate-500 mb-1">여행 이름 (선택)</label>
          <input id="trip-title" type="text" placeholder="예: 26년 가을 태국 골프"
            class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-200" />
        </div>
        <div class="w-24">
          <label class="block text-[11px] font-bold text-slate-500 mb-1">인원</label>
          <div class="flex items-center border border-slate-300 rounded-lg overflow-hidden">
            <button id="ppl-minus" class="px-2.5 py-2 text-slate-500 hover:bg-slate-100 text-lg leading-none">−</button>
            <input id="party-size" type="number" min="1" value="4"
              class="w-full text-center text-sm py-2 focus:outline-none" />
            <button id="ppl-plus" class="px-2.5 py-2 text-slate-500 hover:bg-slate-100 text-lg leading-none">＋</button>
          </div>
        </div>
      </div>

      <!-- 항목 헤더 -->
      <div class="hidden sm:grid grid-cols-[1fr_120px_88px_92px_28px] gap-2 px-1 mb-1 text-[10px] font-bold text-slate-400">
        <span>항목</span><span class="text-right">금액</span><span>통화</span><span>1인/팀</span><span></span>
      </div>
      <div id="rows" class="space-y-2"></div>

      <button id="add-row" class="mt-3 w-full border-2 border-dashed border-slate-300 text-slate-500 text-sm font-semibold rounded-lg py-2 hover:border-emerald-400 hover:text-emerald-600 transition">
        ＋ 항목 추가
      </button>

      <!-- 환율 -->
      <div class="mt-4 pt-4 border-t border-slate-100">
        <div class="text-[11px] font-bold text-slate-500 mb-2">환율 <span class="font-normal text-slate-400">(자동 입력 · 직접 수정 가능, 현지통화 1단위 = 원)</span></div>
        <div id="fx-area" class="flex flex-wrap gap-2"></div>
      </div>
    </div>

    <!-- 결과 카드 -->
    <div class="bg-emerald-600 text-white rounded-2xl shadow-sm p-5 mt-4">
      <div class="flex items-end justify-between flex-wrap gap-2">
        <div>
          <div class="text-[11px] text-emerald-100 font-semibold">1인당 예상 총비용</div>
          <div id="per-person" class="text-3xl font-extrabold leading-tight">₩0</div>
        </div>
        <div class="text-right">
          <div class="text-[11px] text-emerald-100">일행 <span id="ppl-label">4</span>명 합계</div>
          <div id="group-total" class="text-lg font-bold">₩0</div>
        </div>
      </div>
      <div id="warn-missing" class="hidden mt-2 text-[11px] bg-white/15 rounded-lg px-3 py-1.5">⚠️ 금액이 비어있는 항목이 있어요 — 현지에서 추가될 수 있어요.</div>
    </div>

    <!-- 액션 -->
    <div class="grid grid-cols-2 gap-2 mt-3">
      <button id="btn-kakao" class="bg-yellow-400 text-slate-900 font-bold text-sm py-3 rounded-xl hover:bg-yellow-300 transition shadow-sm">📋 카톡 공지 복사</button>
      <button id="btn-save" class="bg-slate-800 text-white font-bold text-sm py-3 rounded-xl hover:bg-slate-900 transition shadow-sm">💾 기록 저장</button>
    </div>

    <!-- 저장된 기록 -->
    <div class="mt-5">
      <button id="toggle-saved" class="text-xs font-bold text-slate-500 hover:text-slate-700">📁 저장된 기록 <span id="saved-count" class="text-slate-400"></span></button>
      <div id="saved-list" class="hidden mt-2 space-y-2"></div>
    </div>

    <p class="text-center text-[11px] text-slate-400 mt-6">설치 없이 바로 쓰는 계산기예요. 견적서 사진을 자동으로 읽어주는 기능은 「고급 보기」에 있어요.</p>
  </div>

  <!-- 토스트 -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-30 px-4 py-2.5 rounded-xl bg-slate-900 text-white text-sm font-semibold shadow-lg opacity-0 translate-y-2 transition-all duration-300 pointer-events-none"></div>

  <script src="mockData.js"></script>
  <script src="calculator.js"></script>
</body>
</html>
